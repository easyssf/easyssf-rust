[package]
name = "easyssf-receiver-actix-web"
description = "The easyssf receiver for actix-web: push endpoint, token revocation middleware and the actix-session hook."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
easyssf-receiver.workspace = true
actix-web = { workspace = true, features = ["macros"] }
actix-session = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
tokio.workspace = true
tracing.workspace = true
futures-util.workspace = true

[features]
default = ["rust-crypto"]
# the crypto backend of easyssf-receiver, forwarded so that the crate builds on its own;
# to use aws-lc-rs, turn the default features off on every easyssf crate and name it on each
rust-crypto = ["easyssf-receiver/rust-crypto"]
aws-lc-rs = ["easyssf-receiver/aws-lc-rs"]
actix-session = ["dep:actix-session", "dep:serde"]

[dev-dependencies]
easyssf-test.workspace = true
serde_json.workspace = true
toml = "1.1"
actix-session = { workspace = true, features = ["cookie-session"] }
actix-web = { workspace = true, features = ["macros", "cookies"] }

[lints]
workspace = true
