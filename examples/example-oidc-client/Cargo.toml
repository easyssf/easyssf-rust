[package]
name = "example-oidc-client"
description = "Example: a web application with OIDC login whose local sessions end when Keycloak revokes the session or the credentials change. Not published."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
example-support.workspace = true
# the workspace dependency turns the default features off; the crypto backend and the HTTP client
# that calls Keycloak are needed here
easyssf-receiver = { workspace = true, features = ["rust-crypto", "reqwest"] }
easyssf-receiver-axum = { workspace = true, features = ["tower-sessions"] }
axum = { workspace = true, features = ["tokio", "http1", "json", "query", "form"] }
http.workspace = true
tower-sessions = { workspace = true, features = ["memory-store", "axum-core"] }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "signal"] }
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
url.workspace = true
humantime = "2"
# OpenID Connect discovery, the authorization code flow and ID token validation; brings its own
# reqwest (0.12) for the calls to Keycloak
openidconnect = "4"

[lints]
workspace = true
