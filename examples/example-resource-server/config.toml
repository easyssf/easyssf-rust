# The configuration of the example resource server. `${VAR:default}` reads the environment variable
# VAR and falls back to the default, like the placeholders of application.yaml in the Java example.

[server]
# SERVER_PORT overrides the port
port = ${SERVER_PORT:8081}

[easyssf.receiver]
# the identity provider is both the issuer of the access tokens and the SSF transmitter: any
# transmitter that sends CAEP session-revoked events does; the default is the realm of the Keycloak
# in ../keycloak, SSF_TRANSMITTER_ISSUER overrides it
transmitter-issuer = "${SSF_TRANSMITTER_ISSUER:http://localhost:8080/realms/ssf-demo}"

# the application registers its own PUSH stream on startup, the transmitter assigns the audience
[easyssf.receiver.stream]
management = "receiver"
events-requested = ["CaepSessionRevoked"]
description = "example-resource-server"

[easyssf.receiver.push]
endpoint-path = "/ssf/push"
# how the transmitter reaches the push endpoint; a transmitter may restrict the push URLs it accepts
# for a client (Keycloak in Docker: 'ssf.validPushUrls' of the client). SSF_PUSH_URL overrides it
delivery-endpoint-url = "${SSF_PUSH_URL:http://host.docker.internal:8081/ssf/push}"
# the stream is created with this authorization header, the transmitter sends it with every SET
expected-auth-header = "Bearer example-resource-server-push-secret"

# the client credentials of the application's OAuth2 client manage the stream; SSF_TOKEN_URI,
# SSF_CLIENT_ID and SSF_CLIENT_SECRET override the defaults, which are the client of the ssf-demo realm
[easyssf.receiver.oauth2]
token-uri = "${SSF_TOKEN_URI:${SSF_TRANSMITTER_ISSUER:http://localhost:8080/realms/ssf-demo}/protocol/openid-connect/token}"
client-id = "${SSF_CLIENT_ID:example-resource-server}"
client-secret = "${SSF_CLIENT_SECRET:example-resource-server-secret}"
scopes = ["ssf.read", "ssf.manage"]

[easyssf.receiver.revocation]
# at least the lifetime of an access token (5 minutes in the compose setup)
ttl = "10m"

# the receiver records easyssf.receiver.* with the `metrics` facade; GET /metrics renders them
[easyssf.receiver.metrics]
enabled = true
