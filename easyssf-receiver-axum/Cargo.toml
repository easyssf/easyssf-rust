[package]
name = "easyssf-receiver-axum"
description = "The easyssf receiver for axum and every framework on tower: push endpoint, token revocation layer and the tower-sessions hook."
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# ends tower-sessions sessions a security event revoked
tower-sessions = ["dep:tower-sessions", "dep:serde"]

[dependencies]
easyssf-receiver.workspace = true
axum.workspace = true
tower.workspace = true
http.workspace = true
tokio.workspace = true
tracing.workspace = true
tower-sessions = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
easyssf-test.workspace = true
easyssf-core.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net"] }
axum = { workspace = true, features = ["tokio", "http1"] }
tower = { workspace = true, features = ["util"] }
tower-sessions = { workspace = true, features = ["memory-store", "axum-core"] }
http-body-util.workspace = true
toml = "0.9"

[lints]
workspace = true
