[package]
name = "easyssf-receiver"
description = "An OpenID Shared Signals Framework receiver without a web framework: SET verification, de-duplication, push and poll delivery, stream management, typed CAEP, RISC and SCIM handlers, token revocation and session termination."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["rust-crypto", "reqwest"]
# the crypto backend of jsonwebtoken; exactly one
rust-crypto = ["jsonwebtoken/rust_crypto"]
aws-lc-rs = ["jsonwebtoken/aws_lc_rs"]
# the HTTP client that calls the transmitter
reqwest = ["dep:reqwest"]
# records easyssf.receiver.* with the `metrics` facade
metrics = ["dep:metrics"]

[dependencies]
easyssf-core.workspace = true
serde.workspace = true
serde_json.workspace = true
jsonwebtoken.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
thiserror.workspace = true
subtle.workspace = true
async-trait.workspace = true
url.workspace = true
base64.workspace = true
uuid.workspace = true
humantime-serde.workspace = true
reqwest = { workspace = true, optional = true, features = ["rustls", "charset", "http2"] }
metrics = { workspace = true, optional = true }

[dev-dependencies]
# path only, no version: easyssf-test depends on this crate, and a dev-dependency with a version
# would keep the cycle in the published manifest, so neither crate could be published first
easyssf-test = { path = "../easyssf-test" }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
toml = "1.1"

[lints]
workspace = true
