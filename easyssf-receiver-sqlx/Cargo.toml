[package]
name = "easyssf-receiver-sqlx"
description = "The database stores of the easyssf receiver on sqlx: processed SETs, revocations and poll acknowledgements, in the tables shared with the Java and .NET libraries."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
easyssf-core.workspace = true
easyssf-receiver.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
tokio-util.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio"] }
futures-util.workspace = true

[features]
default = ["sqlite", "rust-crypto"]
# the crypto backend of easyssf-receiver, forwarded so that the crate builds on its own;
# to use aws-lc-rs, turn the default features off on every easyssf crate and name it on each
rust-crypto = ["easyssf-receiver/rust-crypto"]
aws-lc-rs = ["easyssf-receiver/aws-lc-rs"]
sqlite = ["sqlx/sqlite"]
postgres = ["sqlx/postgres", "sqlx/tls-rustls-ring"]
mysql = ["sqlx/mysql", "sqlx/tls-rustls-ring"]

[dev-dependencies]
easyssf-test.workspace = true
serde_json.workspace = true
url.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
toml = "0.9"

[lints]
workspace = true
