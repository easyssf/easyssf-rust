# cargo-deny: licenses and advisories, see https://embarkstudios.github.io/cargo-deny/

[licenses]
allow = ["Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "OpenSSL", "CDLA-Permissive-2.0"]

[advisories]
# RUSTSEC-2023-0071 (rsa, Marvin attack) concerns private-key operations, which a receiver never
# performs: the `rust-crypto` backend of jsonwebtoken only verifies. Choose the `aws-lc-rs`
# feature of easyssf-receiver to leave the rsa crate out.
#
# RUSTSEC-2026-0387 (crypto-bigint 0.5, timing variability) reaches the receiver through the p256
# and p384 crates of jsonwebtoken 11, which still depend on elliptic-curve 0.13; the fixed 0.7 line
# needs p256 0.14. The receiver only verifies ECDSA signatures, on public keys, signatures and
# digests that are not secret, so timing variability leaks nothing. Drop the ignore once jsonwebtoken
# moves to p256 0.14.
#
# RUSTSEC-2026-0459 (bundled SQLite before 3.54.0, uninitialised page cache with a crafted -wal
# file) reaches easyssf-receiver-sqlx through sqlx-sqlite 0.9.0, which caps libsqlite3-sys below
# 0.38; the fix is in 0.39. Only a process that opens a database and -wal file written by a less
# trusted party is exposed; the stores open the database the operator configures, and the tests run
# on SQLite in memory. Drop the ignore once sqlx allows libsqlite3-sys 0.39.
#
# RUSTSEC-2026-0543 (chrono, unmaintained) is informational, no vulnerability is reported. chrono
# reaches the workspace only through oauth2 5 and openidconnect 4 of example-oidc-client, which is
# not published; no easyssf crate depends on it. Drop the ignore once openidconnect moves off chrono.
#
# RUSTSEC-2026-0542 (humantime, unmaintained) is informational as well and follows from the chrono
# advisory: it calls humantime a wrapper of chrono, but humantime 2.4.0 has no dependencies at all.
# easyssf-receiver uses it through humantime-serde for the durations of `SsfReceiverConfig`, on
# values the operator configures. Drop the ignore once the advisory is withdrawn or the durations
# are parsed by something else.
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2026-0387", "RUSTSEC-2026-0459", "RUSTSEC-2026-0542", "RUSTSEC-2026-0543"]
